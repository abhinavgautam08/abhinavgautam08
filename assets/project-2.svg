<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect x="1" y="1" width="478" height="228" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- title -->
  <text x="28" y="46" font-size="20" font-weight="700" fill="#f0f6fc">Notes.</text>

  <!-- arrow -->
  <g transform="translate(430,26)" stroke="#8b949e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="14" x2="14" y2="0"/>
    <polyline points="4,0 14,0 14,10"/>
  </g>

  <line x1="28" y1="62" x2="452" y2="62" stroke="#21262d" stroke-width="1"/>

  <!-- description -->
  <text x="28" y="94" font-size="13" fill="#8b949e" font-family="'JetBrains Mono', monospace">A premium, local note-taking app for focus,</text>
  <text x="28" y="114" font-size="13" fill="#8b949e" font-family="'JetBrains Mono', monospace">with glassmorphism UI, local AI, and P2P sync.</text>

  <!-- tech tags -->
  <rect x="28" y="148" width="56" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
  <text x="56" y="165" font-size="12" fill="#c9d1d9" text-anchor="middle">HTML</text>

  <rect x="92" y="148" width="48" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
  <text x="116" y="165" font-size="12" fill="#c9d1d9" text-anchor="middle">CSS</text>

  <rect x="148" y="148" width="94" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
  <text x="195" y="165" font-size="12" fill="#c9d1d9" text-anchor="middle">JavaScript</text>

  <!-- link label -->
  <text x="28" y="206" font-size="12" font-weight="600" letter-spacing="1" fill="#58a6ff">VIEW PROJECT →</text>
</svg>
