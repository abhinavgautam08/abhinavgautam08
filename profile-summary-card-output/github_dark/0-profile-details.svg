<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" font-family="'JetBrains Mono', 'Segoe UI', Ubuntu, sans-serif">
  <rect width="1000" height="350" rx="14" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
  
  <text x="35" y="45" font-size="16" font-weight="700" letter-spacing="2" fill="#8b949e">GITHUB PROFILE SUMMARY</text>
  <line x1="35" y1="65" x2="965" y2="65" stroke="#21262d" stroke-width="1"/>
  
  <!-- Stats Blocks -->
  <g transform="translate(35, 90)">
    <!-- Total Contributions -->
    <rect x="0" y="0" width="280" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="35" font-size="12" letter-spacing="1" fill="#8b949e">TOTAL CONTRIBUTIONS</text>
    <text x="20" y="75" font-size="28" font-weight="700" fill="#58a6ff">Full Stack Dev</text>
    
    <!-- Repositories -->
    <rect x="310" y="0" width="280" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="35" fill="#8b949e" font-size="12" letter-spacing="1" transform="translate(310,0)">REPOSITORIES &amp; PROJECTS</text>
    <text x="20" y="75" fill="#3fb950" font-size="28" font-weight="700" transform="translate(310,0)">Active &amp; Open Source</text>
    
    <!-- Commit Activity -->
    <rect x="620" y="0" width="280" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="35" fill="#8b949e" font-size="12" letter-spacing="1" transform="translate(620,0)">COMMIT STREAK</text>
    <text x="20" y="75" fill="#bc8cff" font-size="28" font-weight="700" transform="translate(620,0)">Consistent Code</text>
  </g>
  
  <g transform="translate(35, 220)">
    <rect x="0" y="0" width="900" height="90" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="25" y="35" font-size="12" letter-spacing="1.5" fill="#8b949e">PRIMARY WORKING STACK</text>
    <text x="25" y="65" font-size="18" font-weight="600" fill="#f0f6fc">TypeScript  •  React  •  Node.js  •  Python  •  PostgreSQL  •  Cloud Native</text>
  </g>
</svg>
